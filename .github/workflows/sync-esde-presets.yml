name: Sync ES-DE Presets

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Sync ES-DE presets
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-esde-presets
      FINDINGS_ISSUE_TITLE: "[automated] Review ES-DE preset discovery findings"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Kotlin
        run: |
          curl -fsSLo "$RUNNER_TEMP/kotlin-compiler.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.0/kotlin-compiler-2.4.0.zip
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Sync bridge presets from ES-DE
        run: ./gradlew :app:syncBridgePresets

      - name: Summarize preset changes
        id: preset_summary
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          catalog_path = "presets/bridge-presets.json"
          base_catalog = subprocess.run(
              ["git", "show", f"origin/{os.environ['DEFAULT_BRANCH']}:{catalog_path}"],
              capture_output=True,
              text=True,
          )
          previous_presets = (
              json.loads(base_catalog.stdout).get("presets", []) if base_catalog.returncode == 0 else []
          )
          current_presets = json.loads(Path(catalog_path).read_text()).get("presets", [])
          previous_by_id = {preset["id"]: preset for preset in previous_presets}
          current_by_id = {preset["id"]: preset for preset in current_presets}
          changed_names = [
              (current_by_id.get(preset_id) or previous_by_id[preset_id])["displayName"]
              .replace("\r", " ")
              .replace("\n", " ")
              for preset_id in sorted(set(previous_by_id) | set(current_by_id))
              if previous_by_id.get(preset_id) != current_by_id.get(preset_id)
          ]

          names = list(dict.fromkeys(changed_names))
          if len(names) > 3:
              summary = f"{', '.join(names[:3])}, and {len(names) - 3} more"
          else:
              summary = ", ".join(names)
          if len(summary) > 160:
              summary = f"{summary[:157].rstrip()}..."

          if summary:
              commit_message = f"chore: sync ES-DE bridge presets ({summary})"
              pr_title = f"[automated] Sync ES-DE bridge presets: {summary}"
          else:
              commit_message = "chore: sync ES-DE bridge presets"
              pr_title = "[automated] Sync ES-DE bridge presets"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"commit-message={commit_message}\n")
              output.write(f"pr-title={pr_title}\n")
          PY

      - name: Check for preset sync changes
        id: sync_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate actionable discovery report
        run: |
          mkdir -p build/reports
          kotlin tools/discover-esde-presets.main.kts --actionable > build/reports/esde-preset-findings.md

      - name: Create, update, or close discovery findings issue
        run: |
          issue_number="$(gh issue list --state open --search "${FINDINGS_ISSUE_TITLE} in:title" --json number --jq '.[0].number // empty')"

          if [ -s build/reports/esde-preset-findings.md ]; then
            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" --title "$FINDINGS_ISSUE_TITLE" --body-file build/reports/esde-preset-findings.md
            else
              gh issue create --title "$FINDINGS_ISSUE_TITLE" --body-file build/reports/esde-preset-findings.md
            fi
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "No current ES-DE preset discovery findings."
          fi

      - name: Verify synced project
        if: steps.sync_changes.outputs.changed == 'true'
        run: ./gradlew verify

      - name: Verify generated presets
        if: steps.sync_changes.outputs.changed == 'true'
        run: ./gradlew :buildSrc:verify

      - name: Create or update preset sync pull request
        if: steps.sync_changes.outputs.changed == 'true'
        env:
          SYNC_COMMIT_MESSAGE: ${{ steps.preset_summary.outputs.commit-message }}
          SYNC_PR_TITLE: ${{ steps.preset_summary.outputs.pr-title }}
        run: |
          cat > build/reports/sync-pr-body.md <<'EOF'
          Automated ES-DE bridge preset sync.

          This PR was generated by the daily ES-DE preset sync workflow.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SYNC_BRANCH"
          git add --all
          git commit -m "$SYNC_COMMIT_MESSAGE"
          git fetch origin "$SYNC_BRANCH" || true
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"

          pr_number="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$SYNC_PR_TITLE" --body-file build/reports/sync-pr-body.md
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$SYNC_PR_TITLE" \
              --body-file build/reports/sync-pr-body.md
          fi
