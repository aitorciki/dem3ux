name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without the `v` prefix, e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}

    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format without a v prefix: $VERSION" >&2
            exit 1
          fi

      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Prepare or resume release
        id: prepare
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

            if ! git show "$TAG:app/build.gradle.kts" | grep --fixed-strings --quiet "versionName = \"$VERSION\""; then
              echo "Tag $TAG does not contain app versionName $VERSION." >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "$TAG" "origin/$DEFAULT_BRANCH"; then
              echo "Tag $TAG is not reachable from origin/$DEFAULT_BRANCH." >&2
              echo "Merge $TAG into $DEFAULT_BRANCH before rerunning; do not cherry-pick its release commit." >&2
              exit 1
            fi

            echo "resume=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          requested_version = sys.argv[1]
          path = Path("app/build.gradle.kts")
          content = path.read_text()
          version_name_pattern = re.compile(r'^(\s*versionName\s*=\s*")([^"]+)("\s*)$', re.MULTILINE)
          version_code_pattern = re.compile(r'^(\s*versionCode\s*=\s*)(\d+)(\s*)$', re.MULTILINE)
          version_name_match = version_name_pattern.search(content)
          version_code_match = version_code_pattern.search(content)

          if version_name_match is None or version_code_match is None:
              raise SystemExit("Could not find versionName and versionCode in app/build.gradle.kts")

          current_version = version_name_match.group(2)
          if tuple(map(int, requested_version.split("."))) <= tuple(map(int, current_version.split("."))):
              raise SystemExit(f"Release version must be newer than {current_version}: {requested_version}")

          content, version_name_count = version_name_pattern.subn(
              lambda match: f"{match.group(1)}{requested_version}{match.group(3)}",
              content,
              count=1,
          )
          content, version_code_count = version_code_pattern.subn(
              lambda match: f"{match.group(1)}{int(match.group(2)) + 1}{match.group(3)}",
              content,
              count=1,
          )
          if version_name_count != 1 or version_code_count != 1:
              raise SystemExit("Expected exactly one versionName and versionCode")

          path.write_text(content)
          PY

          echo "resume=false" >> "$GITHUB_OUTPUT"

      - name: Check out existing release tag
        if: steps.prepare.outputs.resume == 'true'
        run: |
          git checkout --detach "$TAG"
          if ! grep --fixed-strings --quiet "versionName = \"$VERSION\"" app/build.gradle.kts; then
            echo "Tag $TAG does not contain app versionName $VERSION." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE || 'JKS' }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_STORE_PASSWORD" ]]; then
            echo "Release signing secrets are not fully configured." >&2
            exit 1
          fi

          keystore_file="$RUNNER_TEMP/dem3ux-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"

          {
            printf 'storeFile=%s\n' "$keystore_file"
            printf 'storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            printf 'storeType=%s\n' "$RELEASE_STORE_TYPE"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare release asset
        run: |
          mkdir -p build/release
          mv app/build/outputs/apk/release/app-release.apk "build/release/dem3ux-$VERSION.apk"

      - name: Commit and push release version
        if: steps.prepare.outputs.resume == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: prepare $TAG release"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"

      - name: Create or update draft release
        env:
          APK: build/release/dem3ux-${{ inputs.version }}.apk
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > is_draft; then
            if [[ "$(<is_draft)" != "true" ]]; then
              echo "Release $TAG is already published." >&2
              exit 1
            fi

            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --draft --title "$TAG"
          fi
